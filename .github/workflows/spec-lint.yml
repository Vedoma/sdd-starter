name: spec-lint

# Enforces the SDD constitution mechanically: a non-compliant PR cannot merge.
# The check runs against the active tree (archives are ignored) and maps each
# finding to a constitution.md clause. See scripts/spec-lint.mjs.

on:
  pull_request:
  push:
    branches: [main]
  # adr-status.yml dispatches this on a PR branch after committing an /adr transition:
  # commits pushed with GITHUB_TOKEN do not trigger `pull_request`, so without it the new
  # head would carry no spec-lint result.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request whose branch is being linted
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve the pull request (dispatched runs)
        if: github.event_name == 'workflow_dispatch'
        id: dispatched
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::input pr must be a pull request number"; exit 1; }
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body,baseRefName,headRefName > "$RUNNER_TEMP/pr.json"
          head="$(jq -r .headRefName "$RUNNER_TEMP/pr.json")"
          if [ "$head" != "$REF_NAME" ]; then
            echo "::error::PR #$PR_NUMBER is on branch $head, but this run is on $REF_NAME"
            exit 1
          fi
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"
          echo "base_ref=$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
      - name: Run spec-lint
        env:
          # Event data reaches the script via env, never inline ${{ }} in the shell, so a
          # crafted PR body or branch name cannot inject into it.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref || steps.dispatched.outputs.base_ref }}
        run: |
          if [ -f "$RUNNER_TEMP/pr-body.md" ]; then
            # Dispatched run: the body was fetched above instead of read from the event.
            PR_BODY="$(cat "$RUNNER_TEMP/pr-body.md")"
          fi
          if [ -n "$BASE_REF" ]; then
            # Pull request: pass the paths it changes so the diff-aware checks run.
            # --no-renames lists a moved file under both its old and its new path, and
            # core.quotePath=false keeps non-ASCII paths as written instead of "\303\251".
            CHANGED_FILES="$(git -c core.quotePath=false diff --name-only --no-renames "origin/$BASE_REF...HEAD")"
            # The paths it adds: a change's new scenario files may land before its delivery.
            ADDED_FILES="$(git -c core.quotePath=false diff --name-only --no-renames --diff-filter=A "origin/$BASE_REF...HEAD")"
            export CHANGED_FILES ADDED_FILES
          else
            # Push: there is no pull request, but Actions still sets PR_BODY (to ""), which
            # spec-lint would read as a PR whose Spec Reference was left empty.
            unset PR_BODY
          fi
          node scripts/spec-lint.mjs
