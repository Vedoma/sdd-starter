# Ceremony configuration for this project.
#
# spec-lint (.github/workflows/spec-lint.yml) reads this to decide which SDD documents
# are MANDATORY. There are no team-size tiers: a document is required because of what the
# project IS (its shape) or because you chose a planning ceremony - never because of how
# many people work on it.
#
# Always required (the methodology's irreducible core):
#   docs/product/brief.md, docs/spec/technical-spec.md, docs/plan/backlog.md

# What the project IS - gates the technical documents:
capabilities:
  ui: false # a user interface       -> docs/design/design.md required
  api: false # a network/public API   -> docs/spec/api-contracts.md required
  data: false # persistent data        -> docs/spec/data-model.md required
  behavior: false # user-facing behaviour -> docs/spec/behavior/*.feature (human-accepted acceptance
  #                 scenarios). Default format contract: Gherkin (docs/spec/behavior/gherkin-guidelines.md);
  #                 pluggable - swap the format and its contract if another serves the project better.

# Which SDD flow is active, and how much planning ceremony you want (gates the two process
# documents):
process:
  mode: greenfield # greenfield | sustain - see "Process mode" below
  prd: false # require docs/product/prd.md (a formal PRD before the spec)
  milestones: false # require docs/plan/milestones.md (a phased roadmap)

# Force a specific document required/optional regardless of the above.
overrides:
  # docs/product/prd.md: required
  # docs/design/design.md: optional

# --- Resolution (implemented by spec-lint) ------------------------------------------
# required =
#     docs/product/brief.md, docs/spec/technical-spec.md, docs/plan/backlog.md   (always)
#   + docs/product/prd.md          if process.prd
#   + docs/plan/milestones.md      if process.milestones
#   + docs/design/design.md        if capabilities.ui
#   + docs/spec/api-contracts.md   if capabilities.api
#   + docs/spec/data-model.md      if capabilities.data
#   + docs/spec/behavior/*.feature if capabilities.behavior   (spec-lint requires >=1 real scenario)
#   +/- overrides
#
# The defaults above are LEAN: a fresh clone only requires the core, so it feels light.
# Turn a flag to `true` as the project takes shape. Starting points are in docs/profiles.md.
#
# --- Process mode (enforced by spec-lint) -------------------------------------------
# process.mode says which flow the project is in, so no agent has to infer it:
#   greenfield  bootstrapping the spec (Phases 1-6). Editing docs/spec/** directly is
#               normal; a docs/changes/CHANGE-* directory is an error.
#   sustain     the spec is accepted (post-MVP / brownfield); every change is a delta under
#               docs/changes/CHANGE-NNNN/. docs/spec/technical-spec.md must declare
#               **Status:** Accepted, and a PR that edits docs/spec/** without touching a
#               change directory is an error.
# Switch greenfield -> sustain deliberately, in its own PR, once the spec is accepted. There
# is no way back: archived changes under greenfield are an error too.
